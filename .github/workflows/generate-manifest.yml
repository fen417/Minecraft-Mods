import json
import os
import hashlib
from datetime import datetime

ROOT = "mods"
modpacks = {}

def md5(path):
    with open(path, "rb") as f:
        return hashlib.md5(f.read()).hexdigest()

for pack in os.listdir(ROOT):
    pack_path = os.path.join(ROOT, pack)
    if not os.path.isdir(pack_path):
        continue

    mods_path = os.path.join(pack_path, "mods")
    mods = []

    if os.path.exists(mods_path):
        for f in os.listdir(mods_path):
            if f.endswith(".jar"):
                full = os.path.join(mods_path, f)
                mods.append({
                    "name": os.path.splitext(f)[0],
                    "filename": f,
                    "download_url": f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/{mods_path}/{f}",
                    "hash": md5(full)
                })

    modpacks[pack] = {
        "mods": mods,
        "extra_archive": "downloads.zip"
    }

manifest = {
    "version": datetime.now().strftime("%Y%m%d%H%M"),
    "minecraft_version": "1.20.1",
    "modpacks": modpacks
}

with open("mods-manifest.json", "w") as f:
    json.dump(manifest, f, indent=2)
